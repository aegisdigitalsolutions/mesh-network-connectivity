name: Build MeshLink APK

# Trigger this from your phone: GitHub repo -> Actions tab -> "Build MeshLink APK"
# -> "Run workflow". When it finishes, download the APK from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build static web export
        env:
          CAPACITOR_BUILD: '1'
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # ---- Stage 2 native bonding engine -------------------------------------
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install native sources into Android project
        run: |
          set -euo pipefail
          PKG_DIR="android/app/src/main/java/com/meshlink/app/bond"
          mkdir -p "$PKG_DIR"
          cp native/android/BondVpnService.kt    "$PKG_DIR/"
          cp native/android/MeshBondingPlugin.kt "$PKG_DIR/"
          # Overwrite the generated MainActivity so the plugin is registered.
          cp native/android/MainActivity.java \
            android/app/src/main/java/com/meshlink/app/MainActivity.java

      - name: Merge manifest additions
        run: |
          python3 native/scripts/merge-manifest.py \
            android/app/src/main/AndroidManifest.xml \
            native/android/AndroidManifest.additions.xml

      - name: Build glorytun (patched, arm64, static)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash native/scripts/build-glorytun-android.sh

      - name: Verify native payload
        run: |
          set -euo pipefail
          BIN="android/app/src/main/jniLibs/arm64-v8a/libglorytun.so"
          test -f "$BIN" || { echo "::error::libglorytun.so missing"; exit 1; }
          file "$BIN" | grep -q aarch64 || { echo "::error::wrong arch"; exit 1; }
          grep -q 'extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::extractNativeLibs missing"; exit 1; }

      - name: Force legacy native lib packaging
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF
      # ------------------------------------------------------------------------

      # Capacitor 7 pulls kotlin-stdlib:1.8.22 while older transitive deps drag in
      # kotlin-stdlib-jdk7/jdk8:1.6.21. In Kotlin 1.8+ the jdk7/jdk8 classes were merged
      # into the main stdlib, so both on the classpath = duplicate classes. Force one version.
      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          echo "Appended Kotlin resolutionStrategy to android/app/build.gradle"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # If any step above fails, this still runs and gives us the error logs to download.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
