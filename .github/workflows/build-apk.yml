name: Build MeshLink APK

# Trigger this from your phone: GitHub repo -> Actions tab -> "Build MeshLink APK"
# -> "Run workflow". When it finishes, download the APK from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build static web export
        env:
          CAPACITOR_BUILD: '1'
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # Capacitor 7 pulls kotlin-stdlib:1.8.22 while older transitive deps drag in
      # kotlin-stdlib-jdk7/jdk8:1.6.21. In Kotlin 1.8+ the jdk7/jdk8 classes were merged
      # into the main stdlib, so both on the classpath = duplicate classes. Force one version.
      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          echo "Appended Kotlin resolutionStrategy to android/app/build.gradle"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # If any step above fails, this still runs and gives us the error logs to download.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
